name: Check author links

# Runs on every pull request so a naming mistake shows up in review,
# before it reaches main. The deploy workflow runs the same check again.
on:
  pull_request:
    paths:
      - 'content/authors/**'
      - 'content/publication/**'
      - 'sea-lab-publication.bib'
      - 'processing/**'
      - 'scripts/check_author_links.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/check_author_links.py
