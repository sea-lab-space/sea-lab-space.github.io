# Inter font pack for the SEA Lab site.
#
# Selected by `appearance.font: Inter` in config/_default/params.yaml. The
# theme lowercases that name and swaps spaces for underscores to find this file,
# then loads `google_fonts` in the page head and feeds the families below into
# its SCSS (headings, body text, and the nav bar).
#
# Inter is a variable font, so one request covers every weight the site uses
# (400 body, 600 nav links, 700 headings) plus italics. The `opsz` axis lets the
# browser pick the right optical size for small text and large headings.

# Font style metadata
name = "Inter"

# Google Fonts CSS API v2 query (the theme adds &display=swap)
google_fonts = "family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700"

# Font families
heading_font = "Inter"
body_font = "Inter"
nav_font = "Inter"
# Code stays in the system monospace font, as before.
mono_font = ""
