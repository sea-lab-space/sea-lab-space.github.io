# Slack app manifest for the website bot. Setup: README.md in this folder.
# Paste this file at https://api.slack.com/apps > Create New App > From a
# manifest. The bot connects out to Slack (Socket Mode), so there is no
# address to fill in.
display_information:
  name: SEA Lab Website
  description: Add a publication to sea-lab.space
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: SEA Lab Website
    always_online: true
  slash_commands:
    - command: /add-paper
      description: Add a publication to the lab website
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
